name: Apple Stock Check

on:
  schedule:
    # Horarios en UTC (Perú/Lima es UTC-5, sin horario de verano)
    - cron: '0 11 * * *'   # 06:00 Lima
    - cron: '0 15 * * *'   # 10:00 Lima
    - cron: '0 19 * * *'   # 14:00 Lima
    - cron: '0 23 * * *'   # 18:00 Lima
    - cron: '0 1 * * *'    # 20:00 Lima (madrugada UTC del día siguiente)
  workflow_dispatch: {}    # permite disparar el job manualmente desde la pestaña Actions

permissions:
  contents: write          # necesario para hacer commit del cache actualizado

concurrency:
  group: apple-stock-check
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Ejecutar chequeo de stock
        env:
          PLAYWRIGHT_HEADLESS: 'true'
          PLAYWRIGHT_DEBUG: 'false'
          SAVE_SCREENSHOTS: 'false'
          TELEGRAM_ENABLED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_PRODUCT: ${{ secrets.TARGET_PRODUCT }}
          TARGET_STATE: ${{ secrets.TARGET_STATE }}
        run: python main.py

      - name: Subir screenshots si hubo error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: screenshots/
          retention-days: 5

      - name: Persistir cache y logs actualizados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/ logs/ || true
          # Solo commitea si hay cambios reales, para no llenar el historial de commits vacíos
          git diff --cached --quiet || git commit -m "chore: actualizar cache de disponibilidad [skip ci]"
          git push